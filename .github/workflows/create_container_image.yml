name: Release Image and Chart
permissions: {}

on:
  push:
    branches:
      - main

concurrency:
  group: github-release-main
  queue: max

env:
  VERSION: 1.${{ github.run_number }}.0
  IMAGE: ghcr.io/theklausklausen/cert-manager-webhook-ipv64

jobs:
  release:
    permissions:
      contents: write
      packages: write

    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image tags
        id: image_tags
        run: |
          main_sha=$(git ls-remote origin refs/heads/main | cut -f1)
          test -n "$main_sha"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo "${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image_tags.outputs.tags }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.12.0

      - name: Package chart
        run: |
          cp -R charts/cert-manager-webhook-ipv64 "$RUNNER_TEMP/chart"
          grep -qx '  tag: latest' "$RUNNER_TEMP/chart/values.yaml"
          sed -i "s/^  tag: latest$/  tag: ${VERSION}/" "$RUNNER_TEMP/chart/values.yaml"
          mkdir -p .cr-release-packages
          helm package "$RUNNER_TEMP/chart" --version "$VERSION" --app-version "$VERSION" --destination .cr-release-packages

      - name: Push chart to GHCR
        run: helm push ".cr-release-packages/cert-manager-webhook-ipv64-${VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish chart release and index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_GENERATE_RELEASE_NOTES: true
        run: |
          cr upload --owner "$GITHUB_REPOSITORY_OWNER" --git-repo "${GITHUB_REPOSITORY#*/}" --commit "$GITHUB_SHA" --skip-existing
          mkdir -p .cr-index
          cr index --owner "$GITHUB_REPOSITORY_OWNER" --git-repo "${GITHUB_REPOSITORY#*/}" --push